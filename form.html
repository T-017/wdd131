<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/form-small.css">
  <link rel="stylesheet" href="styles/form-medium.css">
  <link rel="stylesheet" href="styles/form-large.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <script src="scripts/form.js" defer></script>
  <title>WDD 131 - Dynamic Web Fundamentals - J. Toshio Holt</title>
  <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Product Review Form.">
  <meta name="author" content="J. Toshio Holt">
</head>

<body>
  <header>Product Review</header>
  <main>
    <form method="get" id="revForm" action="review.html" class="rev">
      <fieldset>
        <legend>Product Name*</legend>
        <label>
          <select id="product" name="list" required>
            <option id="" selected disabled>Select a Product... &#9662;</option>
            <option id="prod" >Something</option>
            <!-- <div class="prod-items"></div> -->
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Overall Rating</legend>
        <label><input type="radio" name="rating" value="star" required>1 - Poor</label>
        <label><input type="radio" name="rating" value="star" required>2 - Fair</label>
        <label><input type="radio" name="rating" value="star" required>3 - Good</label>
        <label><input type="radio" name="rating" value="star" required>4 - Very Good</label>
        <label><input type="radio" name="rating" value="star" required>5 - Excellent</label>
      </fieldset>

      <fieldset>
        <legend>Installation Date</legend>
        <label><input type="date" name="instaldate"></label>
      </fieldset>

      <fieldset>
        <legend>Which features did you find useful in the product?</legend>
        (Check all that apply)
        <label><input type="checkbox" name="design" value="yes"> Design</label>
        <label><input type="checkbox" name="durability" value="yes"> Durability</label>
        <label><input type="checkbox" name="use" value="yes"> Ease of Use</label>
        <label><input type="checkbox" name="performance" value="yes"> Performance</label>
      </fieldset>

      <fieldset>
        <legend>Written Review <span>(Optional)</span></legend>
        <label><textarea id="review" class="text-block" name="review" placeholder="Write your review here..."></textarea></label>
      </fieldset>
      
      <fieldset>
        <legend>Your Name <span>(Optional)</span></legend>
        <label><input type="text" name="name"></label>
      </fieldset>
      <input type="submit" value="Post My Review" class="submissions">
    </form>
  </main>
  <footer class="footer">
    <p>© <span id="currentYear"></span> | J. Toshio Holt | United States</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>

</html>
