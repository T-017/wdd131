<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/form-small.css">
  <link rel="stylesheet" href="styles/form-medium.css">
  <link rel="stylesheet" href="styles/form-large.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <script src="scripts/form.js" defer></script>
  <title>WDD 131 - Dynamic Web Fundamentals - J. Toshio Holt</title>
  <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Product Review Form.">
  <meta name="author" content="J. Toshio Holt">
</head>

<body>
  <header>Product Review</header>
  <main>
    <form method="get" id="revForm" action="review.html" class="rev">
      <fieldset>
        <legend>Product Name <span class="required">(Required)</span></legend>
        <label for="product">
          <select id="product" name="list" required>
            <option selected disabled>Select a Product... &#9662;</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Overall Rating <span class="required">(Required)</span></legend>
        <label for="option1"><input type="radio" id="option1" name="rating" value="1" required>1 - Poor</label>
        <label for="option2"><input type="radio" id="option2" name="rating" value="2" required>2 - Fair</label>
        <label for="option3"><input type="radio" id="option3" name="rating" value="3" required>3 - Good</label>
        <label for="option4"><input type="radio" id="option4" name="rating" value="4" required>4 - Very Good</label>
        <label for="option5"><input type="radio" id="option5" name="rating" value="5" required>5 - Excellent</label>
      </fieldset>

      <fieldset>
        <legend>Installation Date <span class="required">(Required)</span></legend>
        <label for="installation"><input type="date" id="installation" name="installdate" required></label>
      </fieldset>

      <fieldset>
        <legend>Which features did you find useful in the product?</legend>
        (Check all that apply)
        <label for="design"><input type="checkbox" id="design" name="choice" value="yes"> Design</label>
        <label for="durability"><input type="checkbox" id="durability" name="choice" value="yes"> Durability</label>
        <label for="use"><input type="checkbox" id="use" name="choice" value="yes"> Ease of Use</label>
        <label for="performance"><input type="checkbox" id="performance" name="choice" value="yes"> Performance</label>
      </fieldset>

      <fieldset>
        <legend>Written Review <span>(Optional)</span></legend>
        <label for="written"><textarea id="written" class="text-block" name="review"
            placeholder="Write your review here..."></textarea></label>
      </fieldset>

      <fieldset>
        <legend>Your Name <span>(Optional)</span></legend>
        <label for="opt-name"><input type="text" id="opt-name" name="name"></label>
      </fieldset>
      <input type="submit" value="Post My Review" class="submissions">
    </form>
  </main>
  <footer class="footer">
    <p>© <span id="currentYear"></span> | J. Toshio Holt | United States</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>

</html>
